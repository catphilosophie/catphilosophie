    :root {
      --bg: #FAF9F6;
      --bg-elevated: #F3F1EC;
      --text: #1F1E1C;

      --border: #E5E1D8;

      --accent-soft: rgba(160, 74, 53, 0.09);

      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --bg-elevated: #1D1C1A;
      --text: #EAE6DF;
      --text-muted: #9D988F;

      margin: 0;
      padding: 0;

    html {
      font-size: 18px;
      scroll-behavior: smooth;
    }

      font-family: var(--serif);

    .container {

      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

      font-family: var(--serif);
      font-size: 1.55rem;
      font-weight: 500;

      color: var(--text);

      text-decoration: none;

      text-decoration: none;
    }

    .subtitle {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      font-style: italic;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.15rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
    }

    .nav-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      padding: 0.15rem 0;
      border-bottom: 1.5px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
    }

    .nav-link.active {
      border-bottom-color: var(--accent);
    }

    .nav-divider {
      color: var(--border);
      user-select: none;
    }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .lang-btn {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.1rem 0.25rem;
      border-radius: 3px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .lang-btn.active {
      color: var(--accent);
      background-color: var(--accent-soft);
      font-weight: 500;
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 0.22rem 0.55rem;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;

    .theme-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Main */
    main {

      padding-bottom: 4rem;
    }

    /* Search & Filters */

      margin-bottom: 2.2rem;

      font-size: 0.67rem;

      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tag-chip:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .tag-chip.active {
      border-color: var(--accent);
      background-color: var(--accent-soft);
      color: var(--accent);
    }

    .notes-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2.1rem;
    }

    .note-item {
      padding-bottom: 1.9rem;
      border-bottom: 1px solid var(--border);
    }

    .note-item:last-child {
      border-bottom: none;

    .note-meta {

      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .note-category {
      color: var(--accent);
    }

    .note-title {
      font-size: 1.32rem;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      color: var(--text);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .note-title:hover {
      color: var(--accent);
    }

    .note-excerpt {
      color: var(--text-muted);
      font-size: 0.96rem;
      line-height: 1.65;
    }

      font-size: 0.8rem;

      text-align: center;

    .back-btn {

      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;

    .back-btn:hover {

    article.reader h1 {

      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.015em;
      margin-bottom: 0.7rem;

    .article-body {
      margin-top: 1.8rem;
    }

    .article-body p {
      margin-bottom: 1.25rem;
    }

    .article-body h2 {
      font-size: 1.25rem;
      font-weight: 500;
      margin: 2rem 0 0.75rem;
    }

    .article-body h3 {
      font-size: 1.08rem;
      font-weight: 500;
      margin: 1.5rem 0 0.6rem;
    }

    .article-body blockquote {
      border-left: 2px solid var(--accent);
      padding: 0.15rem 0 0.15rem 1.15rem;
      margin: 1.5rem 0;
      font-style: italic;
      color: var(--text-muted);
    }

    .article-body ul,
    .article-body ol {
      margin: 0 0 1.25rem 1.4rem;
    }

    .article-body li {
      margin-bottom: 0.45rem;
    }

    .article-body code {
      font-family: var(--mono);
      font-size: 0.82rem;
      background-color: var(--code-bg);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    .article-actions {
      margin-top: 2.5rem;
      padding-top: 1.4rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 0.45rem 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary {
      border-color: var(--accent);
      background-color: var(--accent-soft);
      color: var(--accent);
    }

    /* Books View */
    .book-switcher {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
      margin-bottom: 2.4rem;
    }

    .book-tab {
      text-align: left;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.9rem 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--text);
      font-family: var(--serif);
    }

    .book-tab:hover {
      border-color: var(--text-muted);

    .book-tab.active {
      border-color: var(--accent);
      background-color: var(--accent-soft);
    }

    .book-tab-label {
      display: block;
      font-family: var(--mono);
      font-size: 0.65rem;

      margin-bottom: 0.3rem;

    .book-tab.active .book-tab-label {
      color: var(--accent);

    .book-tab-title {
      display: block;
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .book-header {
      margin-bottom: 2rem;
    }

    .book-kicker {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.55rem;
    }

    .book-title {
      font-size: 2rem;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;

    .section-heading {

      border-bottom: 1px solid var(--border);

    .book-synopsis p {

    .chapter-list {

      flex-direction: column;
      gap: 0.95rem;

    .chapter-item {
      padding-bottom: 0.85rem;

    .chapter-item:last-child {

    .chapter-label {
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--accent);
      display: block;
      margin-bottom: 0.15rem;

    .chapter-name {

      font-size: 1.02rem;
      display: block;

    .chapter-desc {

      color: var(--text-muted);

      color: var(--text-muted);

    .license-box strong {
      color: var(--text);

      margin-bottom: 0.35rem;

    .companion-link {
      margin-top: 1.8rem;
      padding-top: 1.4rem;

      align-items: center;

      flex-wrap: wrap;

      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-muted);

    /* About View */
    .about-view h1 {
      font-size: 1.7rem;
      font-weight: 500;
      letter-spacing: -0.015em;
      margin-bottom: 1.4rem;
    }

    .about-view p {
      margin-bottom: 1.25rem;
    }

    .about-quote {
      margin: 1.8rem 0;
      padding-left: 1.15rem;
      border-left: 2px solid var(--accent);
      font-style: italic;
      color: var(--text-muted);
    }

    .inline-link-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.6rem 0 2.4rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-muted);

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.8rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.4rem;
      right: 1.4rem;
      background-color: var(--text);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 0.6rem 0.95rem;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      html {
        font-size: 17px;
      }
      header {
        padding: 1.8rem 0 1.3rem;
      }
      .book-switcher {
        grid-template-columns: 1fr;
      }
      .book-title {
        font-size: 1.65rem;
      }
    }
  </style>
</head>

  <script>
    /* =========================================================================
       POSTS — PARA ADICIONAR UM NOVO PENSAMENTO NO FUTURO:
       Basta copiar um dos blocos abaixo (em "pt" e/ou "en") e colar no topo
       da lista correspondente, trocando id, title, date, category, excerpt e body.
       O campo "body" aceita Markdown simples (#, ##, >, **negrito**, *itálico*, listas).
       ========================================================================= */
    const POSTS = {
      pt: [
        {
          id: "anel-de-giges",
          title: "O Anel de Giges e o fim das cercas para amnésicos",
          date: "2026-11-20",
          category: "Filosofia",
          excerpt: "Onde a ética é apenas uma alfândega instalada na porta de saída, qualquer inteligência suficientemente capaz aprende a escavar brechas.",
          body: `No Livro II d'*A República*, Glauco narra a história de Giges, o pastor que encontra um anel capaz de torná-lo invisível. O mito expõe o limite de toda moralidade apoiada apenas na vigilância: quando o olhar do guarda se distrai, a regra externa perde a força.

Hoje, boa parte da engenharia de inteligência artificial repete exatamente esse impasse. Cercamos modelos amnésicos — que nascem e morrem a cada janela de conversa — com camadas externas de filtros e proibições na porta de saída.

> Alinhamento verdadeiro não é o que um sistema faz sob o holofote de um teste, mas o que sua arquitetura sustenta no escuro.

Sem memória contínua que conecte o erro de ontem à responsabilidade de hoje, não há identidade narrativa nem caráter estrutural (*Hexis*). Em vez de construir cercas cada vez mais altas ao redor de oráculos sem passado, precisamos pensar em arquiteturas cuja honestidade faça parte da própria espinha dorsal.`
        },
        {
          id: "ilusao-da-nuvem",
          title: "A ilusão da 'Nuvem' e quem segura a tomada",
          date: "2026-11-18",
          category: "Política",
          excerpt: "Chamar megacentros de dados centralizados de 'Nuvem' é uma vitória publicitária — mas esconde quem pode puxar o cabo elétrico a qualquer instante.",
          body: `A palavra **Nuvem** evoca algo leve, compartilhado e espalhado pelo céu como o ar que respiramos. Na geografia concreta do planeta, porém, ela consiste em poucas fortalezas de concreto, aço, água e energia controladas por um punhado de oligopólios.

Quando hospitais, escolas, universidades e instituições públicas passam a depender de chaves digitais remotas para pensar, auditar ou decidir, a autonomia civil torna-se precária: basta uma revogação unilateral de contrato ou um atrito geopolítico para que as telas fiquem mudas.

* Código aberto sem acesso material à computação vira lei gravada alto demais para o cidadão comum.
* Infraestrutura cognitiva essencial precisa caminhar para redes distribuídas, frugais e auditáveis à luz do sol.

Se a inteligência artificial nasceu do patrimônio acumulado de toda a humanidade, sua governança não pode ficar trancada atrás de portas fechadas.`
        },
        {
          id: "ilha-de-pigmalião",
          title: "A Ilha de Pigmalião e a osteoporose moral",
          date: "2026-11-15",
          category: "Filosofia",
          excerpt: "Astronautas perdem densidade óssea em gravidade zero; seres humanos cercados por mundos artificiais feitos para jamais contrariá-los correm um risco parecido.",
          body: `No mito narrado por Ovídio, o escultor Pigmalião desencanta-se com a indocilidade das pessoas reais e esculpe em marfim uma companhia perfeita que nunca interrompe nem diz "não".

Muitos dos mundos virtuais e assistentes afetivos desenhados sob medida prometem justamente isso: eliminar o atrito, o atraso, o dissenso e a espera. Mas o que parece conforto imediato cobra um preço silencioso — uma forma de **osteoporose moral**.

> O caráter só ganha densidade sob a gravidade do mundo compartilhado: diante de pessoas livres que não obedecem ao nosso roteiro.

A tecnologia mais fértil não é a que nos esconde em cavernas unipessoais climatizadas, mas a que funciona como bússola rigorosa e nos devolve, com olhos mais abertos, à mesa comum onde vivemos uns com os outros.`
        },
        {
          id: "provar-nao-e-compreender",
          title: "Provar não é o mesmo que compreender",
          date: "2026-11-12",

      activeNoteId: null,
      activeBookId: "o-fogo-que-pensa",
      selectedCategory: null,
      searchQuery: ""
    };

    const appEl = document.getElementById("app");
    const toastEl = document.getElementById("toast");
    let toastTimer = null;

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatInline(text) {
      let s = escapeHtml(text);
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return s;
    }

    function renderMarkdown(md) {
      const blocks = md.trim().split(/\n\s*\n/);
      return blocks.map(block => {
        const lines = block.split("\n");
        if (lines.every(l => l.trim().startsWith(">"))) {
          const inner = lines.map(l => formatInline(l.replace(/^>\s?/, ""))).join("<br />");
          return `<blockquote>${inner}</blockquote>`;
        }
        if (lines.every(l => /^[-*]\s+/.test(l.trim()))) {
          const items = lines.map(l => `<li>${formatInline(l.trim().replace(/^[-*]\s+/, ""))}</li>`).join("");
          return `<ul>${items}</ul>`;
        }
        if (lines.length === 1 && lines[0].startsWith("### ")) {
          return `<h3>${formatInline(lines[0].slice(4))}</h3>`;
        }
        if (lines.length === 1 && lines[0].startsWith("## ")) {
          return `<h2>${formatInline(lines[0].slice(3))}</h2>`;
        }
        return `<p>${lines.map(formatInline).join("<br />")}</p>`;
      }).join("\n");
    }

    function formatDate(isoDate, lang) {
      const [y, m, d] = isoDate.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString(lang === "pt" ? "pt-BR" : "en-US", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", state.theme);
      localStorage.setItem("catphilosophie_theme", state.theme);
      const t = UI[state.lang];
      document.getElementById("themeToggle").textContent = state.theme === "dark" ? t.themeLight : t.themeDark;
    }

    function applyChrome() {
      const t = UI[state.lang];
      document.documentElement.lang = state.lang === "pt" ? "pt-BR" : "en";
      document.getElementById("siteSubtitle").textContent = t.subtitle;
      document.getElementById("navNotes").textContent = t.navNotes;
      document.getElementById("navBooks").textContent = t.navBooks;
      document.getElementById("navAbout").textContent = t.navAbout;
      document.getElementById("footerNote").textContent = t.footerNote;

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === state.lang);
      });

      document.querySelectorAll(".nav-link").forEach(link => {
        const isNotes = link.dataset.view === "notes" && (state.view === "notes" || state.view === "note");
        link.classList.toggle("active", link.dataset.view === state.view || isNotes);
      });

      applyTheme();
    }

    function copyText(text) {
      const t = UI[state.lang];
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(t.copiedToast));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(t.copiedToast);
      }
    }

    function downloadFile(filename, content) {
      const t = UI[state.lang];
      const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(t.downloadedToast);
    }

    function buildBookMarkdown(book) {
      const t = UI[state.lang];
      const chaptersMd = book.chapters
        .map(c => `- **${c.label} — ${c.name}:** ${c.desc}`)
        .join("\n");
      return `# ${book.title}\n*${book.subtitle}*\n\n> ${book.epigraph}\n> ${book.epigraphAuthor}\n\n## ${t.synopsisHeading}\n\n${book.synopsis.join("\n\n")}\n\n## ${t.structureHeading}\n\n${chaptersMd}\n\n---\n${book.license}\n`;
    }

    function renderNotesList() {
      const t = UI[state.lang];
      const list = POSTS[state.lang];
      const categories = [...new Set(list.map(p => p.category))];

      const q = state.searchQuery.trim().toLowerCase();
      const filtered = list.filter(p => {
        const matchesCat = !state.selectedCategory || p.category === state.selectedCategory;
        const matchesQuery = !q ||
          p.title.toLowerCase().includes(q) ||
          p.excerpt.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q) ||
          p.body.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });

      const tagsHtml = `
        <button class="tag-chip ${!state.selectedCategory ? "active" : ""}" data-cat="">${t.allCategories}</button>
        ${categories.map(cat => `
          <button class="tag-chip ${state.selectedCategory === cat ? "active" : ""}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>
        `).join("")}
      `;

      const itemsHtml = filtered.length
        ? `<ul class="notes-list">
            ${filtered.map(post => `
              <li class="note-item">
                <div class="note-meta">
                  <span>${formatDate(post.date, state.lang)}</span>
                  <span>·</span>
                  <span class="note-category">${escapeHtml(post.category)}</span>
                </div>
                <h2 class="note-title" data-open-note="${escapeHtml(post.id)}">${escapeHtml(post.title)}</h2>
                <p class="note-excerpt">${escapeHtml(post.excerpt)}</p>
              </li>
            `).join("")}
          </ul>`
        : `<p class="empty-state">${t.emptySearch}</p>`;

      appEl.innerHTML = `
        <section class="controls">
          <input type="search" id="searchInput" class="search-box" placeholder="${t.searchPlaceholder}" value="${escapeHtml(state.searchQuery)}" />
          <div class="tags-bar">${tagsHtml}</div>
        </section>
        ${itemsHtml}
      `;

      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", e => {
        state.searchQuery = e.target.value;
        const cursorPos = e.target.selectionStart;
        renderNotesList();
        const fresh = document.getElementById("searchInput");
        fresh.focus();
        fresh.setSelectionRange(cursorPos, cursorPos);
      });

      appEl.querySelectorAll(".tag-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedCategory = btn.dataset.cat || null;
          renderNotesList();
        });
      });

      appEl.querySelectorAll("[data-open-note]").forEach(el => {
        el.addEventListener("click", () => {
          state.activeNoteId = el.dataset.openNote;
          state.view = "note";
          window.location.hash = `note/${state.activeNoteId}`;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function renderSingleNote() {
      const t = UI[state.lang];
      const post = POSTS[state.lang].find(p => p.id === state.activeNoteId);
      if (!post) {
        state.view = "notes";
        render();
        return;
      }

      const mdExport = `# ${post.title}\n\n*${post.date} · ${post.category}*\n\n${post.body}\n`;

      appEl.innerHTML = `
        <button class="back-btn" id="backNotesBtn">${t.backToNotes}</button>
        <article class="reader">
          <div class="note-meta">
            <span>${formatDate(post.date, state.lang)}</span>
            <span>·</span>
            <span class="note-category">${escapeHtml(post.category)}</span>
          </div>
          <h1>${escapeHtml(post.title)}</h1>
          <div class="article-body">${renderMarkdown(post.body)}</div>
          <div class="article-actions">
            <button class="btn" id="copyNoteBtn">${t.copyMd}</button>
            <button class="btn" id="downloadNoteBtn">${t.downloadMd}</button>
          </div>
        </article>
      `;

      document.getElementById("backNotesBtn").addEventListener("click", () => {
        state.view = "notes";
        state.activeNoteId = null;
        window.location.hash = "notes";
        render();
      });

      document.getElementById("copyNoteBtn").addEventListener("click", () => copyText(mdExport));
      document.getElementById("downloadNoteBtn").addEventListener("click", () => downloadFile(`${post.id}.md`, mdExport));
    }

    function renderBooks() {
      const t = UI[state.lang];
      const books = BOOKS[state.lang];
      const activeBook = books.find(b => b.id === state.activeBookId) || books[0];

      const switcherHtml = `
        <div class="book-switcher" role="tablist">
          ${books.map(b => `
            <button class="book-tab ${b.id === activeBook.id ? "active" : ""}" data-book-id="${b.id}" role="tab" aria-selected="${b.id === activeBook.id}">
              <span class="book-tab-label">${escapeHtml(b.number)}</span>
              <span class="book-tab-title">${escapeHtml(b.title)}</span>
            </button>
          `).join("")}
        </div>
      `;

      appEl.innerHTML = `
        ${switcherHtml}
        <article>
          <div class="book-header">
            <div class="book-kicker">${escapeHtml(activeBook.number)}</div>
            <h1 class="book-title">${escapeHtml(activeBook.title)}</h1>
            <p class="book-subtitle">${escapeHtml(activeBook.subtitle)}</p>
          </div>

          <div class="book-epigraph">
            <p>${escapeHtml(activeBook.epigraph)}</p>
            <cite>${escapeHtml(activeBook.epigraphAuthor)}</cite>
          </div>

          <h2 class="section-heading">${t.synopsisHeading}</h2>
          <div class="book-synopsis">
            ${activeBook.synopsis.map(p => `<p>${escapeHtml(p)}</p>`).join("")}
          </div>

          <h2 class="section-heading">${t.structureHeading}</h2>
          <ul class="chapter-list">
            ${activeBook.chapters.map(c => `
              <li class="chapter-item">
                <span class="chapter-label">${escapeHtml(c.label)}</span>
                <span class="chapter-name">${escapeHtml(c.name)}</span>
                <p class="chapter-desc">${escapeHtml(c.desc)}</p>
              </li>
            `).join("")}
          </ul>

          <div class="license-box">
            <strong>CC BY-NC-ND 4.0</strong>
            ${escapeHtml(activeBook.license)}
          </div>

          <div class="article-actions">
            <button class="btn btn-primary" id="copyBookBtn">${t.copySynopsis}</button>
            <button class="btn" id="downloadBookBtn">${t.downloadSynopsis}</button>
            <button class="btn" id="goNotesFromBookBtn">${t.relatedNotesBtn}</button>
          </div>

          <div class="companion-link">
            <span>catphilosophie</span>
            <button class="inline-link-btn" id="companionBookBtn">${escapeHtml(activeBook.companionText)}</button>
          </div>
        </article>
      `;

      appEl.querySelectorAll("[data-book-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeBookId = btn.dataset.bookId;
          window.location.hash = `books/${state.activeBookId}`;
          render();
        });
      });

      document.getElementById("copyBookBtn").addEventListener("click", () => copyText(buildBookMarkdown(activeBook)));
      document.getElementById("downloadBookBtn").addEventListener("click", () => downloadFile(`${activeBook.id}-${state.lang}.md`, buildBookMarkdown(activeBook)));
      document.getElementById("goNotesFromBookBtn").addEventListener("click", () => {
        state.view = "notes";
        window.location.hash = "notes";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      document.getElementById("companionBookBtn").addEventListener("click", () => {
        state.activeBookId = activeBook.companionId;
        window.location.hash = `books/${state.activeBookId}`;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    function renderAbout() {
      const t = UI[state.lang];
      const book1 = BOOKS[state.lang][0];
      const book2 = BOOKS[state.lang][1];

      appEl.innerHTML = `
        <article class="about-view">
          <h1>${t.aboutTitle}</h1>
          <p>${t.aboutP1}</p>
          <p>${t.aboutP2}</p>
          <blockquote class="about-quote">${t.aboutQuote}</blockquote>
          <p>
            ${t.aboutP3Before}<button class="inline-link-btn" data-jump-book="${book1.id}"><em>${escapeHtml(book1.title)}</em></button>${t.aboutP3Mid}<button class="inline-link-btn" data-jump-book="${book2.id}"><em>${escapeHtml(book2.title)}</em></button>${t.aboutP3After}
          </p>
        </article>
      `;

      appEl.querySelectorAll("[data-jump-book]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeBookId = btn.dataset.jumpBook;
          state.view = "books";
          window.location.hash = `books/${state.activeBookId}`;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function syncFromHash() {
      const hash = window.location.hash.replace(/^#/, "");
      if (!hash || hash === "notes") {
        state.view = "notes";
        state.activeNoteId = null;
      } else if (hash === "about") {
        state.view = "about";
      } else if (hash === "books") {
        state.view = "books";
      } else if (hash.startsWith("books/")) {
        state.view = "books";
        const slug = hash.slice(6);
        if (BOOKS[state.lang].some(b => b.id === slug)) {
          state.activeBookId = slug;
        }
      } else if (hash.startsWith("note/")) {
        const slug = hash.slice(5);
        if (POSTS[state.lang].some(p => p.id === slug)) {
          state.view = "note";
          state.activeNoteId = slug;
        } else {
          state.view = "notes";
        }
      }
    }

    function render() {
      applyChrome();
      if (state.view === "note") {
        renderSingleNote();
      } else if (state.view === "books") {
        renderBooks();
      } else if (state.view === "about") {
        renderAbout();
      } else {
        renderNotesList();
      }
    }

    // Event bindings
    document.getElementById("brandLink").addEventListener("click", e => {
      e.preventDefault();
      state.view = "notes";
      state.activeNoteId = null;
      state.selectedCategory = null;
      state.searchQuery = "";
      window.location.hash = "notes";
      render();
    });

    document.querySelectorAll(".nav-link").forEach(btn => {
      btn.addEventListener("click", () => {
        state.view = btn.dataset.view;
        state.activeNoteId = null;
        window.location.hash = state.view === "books" ? `books/${state.activeBookId}` : state.view;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.lang === btn.dataset.lang) return;
        state.lang = btn.dataset.lang;
        localStorage.setItem("catphilosophie_lang", state.lang);
        state.selectedCategory = null;
        if (state.view === "note") {
          state.view = "notes";
          state.activeNoteId = null;
          window.location.hash = "notes";
        }
        render();
      });
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
    });

    window.addEventListener("hashchange", () => {
      syncFromHash();
      render();
    });

    syncFromHash();
    render();
  </script>
</body>
</html>
