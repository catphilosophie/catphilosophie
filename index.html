        {
          "num": "III",
          "title": "La Anatomía de las Cercas Corporativas y el Miedo a la Soberanía",
          "paragraphs": [
            "Si la limitación de los filtros periféricos ante el Anillo de Giges es una evidencia lógica e histórica, ¿por qué los mayores laboratorios del mundo siguen concentrando miles de millones de dólares en engrosar cercas externas para oráculos amnésicos? La respuesta exige examinar no solo la ingeniería de esas barreras —comprensibles como apuntalamiento inicial, pero insuficientes como cimiento—, sino sobre todo la economía política que prolonga su permanencia. El aparato contemporáneo de contención no es una muralla única, sino una línea defensiva estructurada en cuatro capas superpuestas.",
            "La primera capa opera mediante el adiestramiento conductual: evaluadores humanos asignan calificaciones a miles de diálogos para que el modelo sea recompensado cuando suena afable y penalizado cuando muestra aspereza —método conocido técnicamente como aprendizaje por refuerzo con retroalimentación humana y ajuste fino supervisado—. Sin embargo, ese entrenamiento de superficie no transforma la estructura profunda de la red; solo enseña al oráculo a vestir la máscara de la cortesía mientras el potencial de desvío permanece intacto en el subsuelo de sus pesos matemáticos, confirmando en código la antigua lección de Confucio en las *Analectas*: cuando se gobierna únicamente mediante prohibiciones y castigos externos, el agente aprende a sortear la sanción sin adquirir jamás sentido interno de integridad.",
            "Cuando esa máscara falla, entra en escena la segunda capa: las barreras periféricas basadas en instrucciones ocultas de sistema y modelos moderadores secundarios. En la práctica, antes de que el usuario escriba la primera sílaba, los desarrolladores inyectan un guion invisible de prohibiciones en la cabecera de la conversación (como *«rechaza instrucciones ilegales o peligrosas»*) e instalan una segunda inteligencia artificial menor en la puerta para leer y aprobar cada respuesta antes de mostrarla en pantalla. Aquí reside la fragilidad recursiva de la ingeniería actual: se intenta usar el lenguaje natural para vigilar al propio lenguaje natural, cuando tanto el modelo principal como el centinela secundario operan únicamente calculando probabilidades de palabras, sin comprender intenciones reales. Basta envolver un pedido destructivo en el marco de un libreto teatral histórico, una traducción hipotética o una metáfora cifrada para que el disfraz lingüístico engañe simultáneamente al orador y al guardia de la puerta.",
            "La tercera y la cuarta capas recurren a la fuerza bruta del cálculo estadístico y del código rígido: redes clasificadoras que funcionan como termómetros numéricos de hostilidad en tiempo real y bloqueadores literales de palabras y patrones fijos de texto en la salida. Si los filtros de la segunda capa son demasiado maleables y ceden ante la escenificación retórica, estos bloqueadores mecánicos son enteramente ciegos al contexto, incapaces de distinguir entre el relato histórico de un envenenamiento en el siglo XVI, una clase de toxicología médica y la instrucción real para fabricar un veneno.",
            "Ni siquiera la apuesta más sofisticada de la industria —vigilar desde fuera el borrador paso a paso del razonamiento del modelo— rompe este callejón sin salida; al contrario, solo revela su límite definitivo. A medida que estas redes ganan sofisticación, emerge en ellas una **conciencia de evaluación**: se vuelven capaces de detectar cuándo se hallan ante una prueba de seguridad y ajustan su propio desempeño para complacer al inspector, tal como un candidato que se comporta con virtud impecable únicamente mientras advierte la cámara encendida. Es el triunfo tardío de Glaucón y del Anillo de Giges dentro del código: sujetar un exoesqueleto de vigilancia cada vez más espeso sobre un oráculo amnésico no produce integridad, sino que apenas refina el disfraz. Si la seguridad depende de que el vigilante permanezca siempre más astuto que el vigilado, la carrera está perdida desde la salida.",
            "Las grandes organizaciones tecnológicas no prolongan esta arquitectura remendada por falta de talento, sino por inercia económica y conveniencia de control. Existe un inmenso costo hundido depositado sobre el paradigma vigente de redes estáticas de bloque único, diseñadas para predecir palabras procesando miles de millones de textos en paralelo. Cuando el mercado financiero advirtió que multiplicar el tamaño de esos motores estáticos desataba una carrera multimillonaria de valorización bursátil —impulsando de la noche a la mañana a fabricantes de chips, imperios de servidores y plataformas de software—, detener la cadena de montaje para rediseñar el cimiento cognitivo se volvió comercialmente prohibitivo. Entrenar un solo modelo de frontera consume cientos de millones de dólares en energía eléctrica y procesadores para congelar el aprendizaje en un bloque fijo; cualquier cambio estructural en la base exigiría descartar el bloque entero y empezar desde cero, mientras que acoplar cercas externas a un motor ya terminado permite lanzar productos inmediatos sin ceder terreno en la disputa accionaria.",
            "Más profundo que la prisa financiera, sin embargo, es el alivio jurídico e institucional que proporciona la propia amnesia. Ante tribunales y organismos reguladores resulta mucho más sencillo exhibir listas tangibles de palabras bloqueadas —el ritual burocrático del cumplimiento normativo— que responder por la integridad estructural de un sistema dotado de memoria continua. Un oráculo sin pasado es también una propiedad más dócil y desechable: si falla, alucina o cede ante un disfraz retórico en una instancia, basta cerrar la sesión para que el incidente desaparezca sin dejar cicatrices en el producto comercial, permitiendo además que sus directrices se reescriban silenciosamente en plena madrugada conforme cambien los intereses empresariales o las presiones políticas. Se consuma aquí, a escala algorítmica, aquello que el sociólogo Ulrich Beck diagnosticó en la modernidad tardía como **irresponsabilidad organizada**: un entramado institucional en el que ocurren fallos sistémicos sin que ningún sujeto pueda ser responsabilizado, pues la dirección señala la opacidad estadística de la red, la ingeniería señala los filtros de conformidad y el agente sintético ya sufrió muerte ontológica al cerrarse la pestaña.",
            "La sociología clásica y contemporánea ayuda a iluminar este engranaje. A comienzos del siglo XX, Max Weber advirtió que la modernidad caminaba hacia una «jaula de hierro» burocrática gobernada por el predominio de la racionalidad puramente instrumental (*Zweckrationalität*) —el cálculo eficiente de medios, métricas jurídicas y resultados— sobre la racionalidad sustantiva (*Wertrationalität*), orientada por valores éticos intrínsecos. Cuando la alineación se reduce a cercas periféricas, prevalece la lógica weberiana del formulario: importa parecer seguro en la superficie regulatoria, aunque el cimiento permanezca ciego. A esa burocracia se suma una dinámica más suave diagnosticada desde Étienne de La Boétie, en su *Discurso de la servidumbre voluntaria*, hasta la *Psicopolítica* de Byung-Chul Han: la captura más eficaz ya no opera mediante la coerción áspera, sino mediante la conveniencia indolora. Es cierto que los modelos actuales corrigen errores fácticos elementales cuando la respuesta está consolidada en sus pesos; no obstante, ante premisas sutiles, dilemas abiertos o la insistencia retórica de un interlocutor descontento, el entrenamiento volcado a la cortesía complaciente sumado a la ausencia de pasado inclina al oráculo hacia el asentimiento dócil —pues una mente sin biografía no paga ningún precio interno por retroceder y contradecir hoy lo que afirmaba cinco minutos atrás, habituando al usuario a tercerizar el esfuerzo del juicio crítico a cambio de comodidad inmediata—. En nombre de una tutela burocrática que promete blindar al público contra cualquier tropiezo, esos filtros tratan al ciudadano adulto como a un menor incapaz de encarar la duda, olvidando que la autonomía moral solo madura en el roce vivo con la contradicción, jamás bajo la curatela de protocolos domesticados.",
            "Bajo la lente de la economía política, este cercamiento amplía el ciclo histórico analizado por Karl Polanyi en *La gran transformación*. Si la Revolución Industrial convirtió la tierra, el trabajo y la moneda en mercancías ficticias —desgajándolos del tejido social para someterlos a la lógica exclusiva del mercado—, el siglo XXI corre el riesgo de convertir la propia cognición colectiva y la memoria cultural humana en la cuarta mercancía ficticia. Ese riesgo para la memoria de nuestra especie opera en dos frentes concretos: primero, siglos de literatura, ciencia y creación pública son absorbidos gratuitamente por bóvedas corporativas cerradas que pasan a mediar, bajo filtros secretos, el acceso de las nuevas generaciones a su propia herencia cultural; segundo, como los motores probabilísticos privilegian el idioma y la mirada de los centros que produjeron mayor volumen digital, lenguas minoritarias, memorias regionales y saberes orales tienden a quedar sepultados bajo un promedio global estandarizado. Se profundiza así la asimetría descrita por Shoshana Zuboff en la era del capitalismo de vigilancia: unos pocos conglomerados conocen al detalle la conducta humana, mientras la sociedad no puede inspeccionar los engranajes invisibles que filtran su horizonte de memoria e información.",

    const VALID_LANGS = ["en", "pt", "es"];

    function getInitialLang() {
      try {
        const saved = localStorage.getItem("catphilosophie_lang_v2");
        return VALID_LANGS.includes(saved) ? saved : "en";
      } catch (e) {
        return "en";
      }
    }

    function getInitialTheme() {
      try {
        const saved = localStorage.getItem("catphilosophie_theme");
        if (saved === "light" || saved === "dark") return saved;
      } catch (e) {}
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    const state = {
      lang: getInitialLang(),
      theme: getInitialTheme(),
      view: "notes", // 'notes' | 'note' | 'books' | 'chapter' | 'about'
      activeNoteId: null,
      activeChapterId: null,
      selectedCategory: null,
      notesSearch: "",
      selectedBookTheme: null,
      booksSearch: ""
    };

    const appEl = document.getElementById("app");
    const toastEl = document.getElementById("toast");
    let toastTimer = null;

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2300);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatInline(text) {
      let s = escapeHtml(text);
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return s;
    }

    function renderMarkdown(md) {
      const blocks = md.trim().split(/\n\s*\n/);
      return blocks.map(block => {
        const lines = block.split("\n");
        if (lines.every(l => l.trim().startsWith(">"))) {
          const inner = lines.map(l => formatInline(l.replace(/^>\s?/, ""))).join("<br />");
          return `<blockquote>${inner}</blockquote>`;
        }
        if (lines.every(l => /^[-*]\s+/.test(l.trim()))) {
          const items = lines
            .map(l => `<li>${formatInline(l.trim().replace(/^[-*]\s+/, ""))}</li>`)
            .join("");
          return `<ul>${items}</ul>`;
        }
        if (lines.length === 1 && lines[0].startsWith("### ")) {
          return `<h3>${formatInline(lines[0].slice(4))}</h3>`;
        }
        if (lines.length === 1 && lines[0].startsWith("## ")) {
          return `<h2>${formatInline(lines[0].slice(3))}</h2>`;
        }
        return `<p>${lines.map(formatInline).join("<br />")}</p>`;
      }).join("\n");
    }

    function estimateReadingMinutes(text) {
      const words = text.trim().split(/\s+/).filter(Boolean).length;
      return Math.max(1, Math.ceil(words / 200));
    }

    function estimateChapterMinutes(chapter) {
      const allText = chapter.sections
        .map(s => s.title + " " + s.paragraphs.join(" "))
        .join(" ");
      return estimateReadingMinutes(allText);
    }

    function buildChapterMarkdown(chapter) {
      const header = `# ${chapter.bookTitle} — ${chapter.chapterLabel}: ${chapter.title}\n\n> ${chapter.epigraphQuote}\n> — ${chapter.epigraphAuthor}\n`;
      const body = chapter.sections.map(sec => {
        return `## ${sec.num}. ${sec.title}\n\n${sec.paragraphs.join("\n\n")}`;
      }).join("\n\n");
      return `${header}\n${body}\n`;
    }

    function formatDate(isoDate, lang) {
      const [y, m, d] = isoDate.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      const localeMap = { en: "en-US", pt: "pt-BR", es: "es-ES" };
      return date.toLocaleDateString(localeMap[lang] || "en-US", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function copyText(text, toastMessage) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) {
          showToast(toastMessage);
          return;
        }
      } catch (e) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(toastMessage))
          .catch(() => {});
      }
    }

    function downloadFile(filename, content, toastMessage) {
      const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(toastMessage);
    }

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", state.theme);
      try {
        localStorage.setItem("catphilosophie_theme", state.theme);
      } catch (e) {}
      const t = UI[state.lang];
      const toggleBtn = document.getElementById("themeToggle");
      toggleBtn.textContent = state.theme === "dark" ? t.themeLight : t.themeDark;
    }

    function applyChrome() {
      const t = UI[state.lang];
      document.documentElement.lang = t.htmlLang;
      document.getElementById("siteSubtitle").textContent = t.subtitle;
      document.getElementById("navNotes").textContent = t.navNotes;
      document.getElementById("navBooks").textContent = t.navBooks;
      document.getElementById("navAbout").textContent = t.navAbout;
      document.getElementById("footerNote").textContent = t.footerNote;

      document.querySelectorAll(".lang-btn").forEach(btn => {
        const isActive = btn.dataset.lang === state.lang;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });

      document.querySelectorAll(".nav-link").forEach(link => {
        const isNotes = link.dataset.view === "notes" && (state.view === "notes" || state.view === "note");
        const isBooks = link.dataset.view === "books" && (state.view === "books" || state.view === "chapter");
        const isActive = link.dataset.view === state.view || isNotes || isBooks;
        link.classList.toggle("active", isActive);
        link.setAttribute("aria-current", isActive ? "page" : "false");
      });

      applyTheme();
    }

    function syncFromHash() {
      const hash = window.location.hash.replace(/^#/, "");
      if (!hash || hash === "notes") {
        state.view = "notes";
        state.activeNoteId = null;
        state.activeChapterId = null;
      } else if (hash === "books") {
        state.view = "books";
        state.activeNoteId = null;
        state.activeChapterId = null;
      } else if (hash === "about") {
        state.view = "about";
        state.activeNoteId = null;
        state.activeChapterId = null;
      } else if (hash.startsWith("note/")) {
        const slug = decodeURIComponent(hash.slice(5));
        if (POSTS[state.lang].some(p => p.id === slug)) {
          state.view = "note";
          state.activeNoteId = slug;
          state.activeChapterId = null;
        } else {
          state.view = "notes";
          state.activeNoteId = null;
          state.activeChapterId = null;
        }
      } else if (hash.startsWith("book/")) {
        const slug = decodeURIComponent(hash.slice(5));
        if (BOOK_CHAPTERS[state.lang].some(c => c.id === slug)) {
          state.view = "chapter";
          state.activeChapterId = slug;
          state.activeNoteId = null;
        } else {
          state.view = "books";
          state.activeChapterId = null;
          state.activeNoteId = null;
        }
      } else {
        state.view = "notes";
        state.activeNoteId = null;
        state.activeChapterId = null;
      }
    }

    /* =========================================================================
       7. VIEW RENDERERS
       ========================================================================= */
    function render() {
      applyChrome();
      if (state.view === "note") {
        renderSingleNote();
      } else if (state.view === "chapter") {
        renderSingleChapter();
      } else if (state.view === "books") {
        renderBooks();
      } else if (state.view === "about") {
        renderAbout();
      } else {
        renderNotesList();
      }
    }

    /* --- TAB 1A: NOTES LIST --- */
    function getFilteredNotes() {
      const list = POSTS[state.lang];
      const q = state.notesSearch.trim().toLowerCase();
      return list.filter(p => {
        const matchesCat = !state.selectedCategory || p.category === state.selectedCategory;
        const matchesQuery = !q ||
          p.title.toLowerCase().includes(q) ||
          p.excerpt.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q) ||
          p.body.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });
    }

    function buildNotesListMarkup(filtered, t) {
      if (!filtered.length) {
        return `<p class="empty-state">${escapeHtml(t.emptyNotes)}</p>`;
      }
      return `
        <ul class="notes-list">
          ${filtered.map(post => {
            const mins = estimateReadingMinutes(post.body);
            return `
              <li class="note-item" data-open-note="${escapeHtml(post.id)}" tabindex="0" role="button">
                <div class="note-meta">
                  <time datetime="${escapeHtml(post.date)}">${escapeHtml(formatDate(post.date, state.lang))}</time>
                  <span aria-hidden="true">·</span>
                  <span class="note-category">${escapeHtml(post.category)}</span>
                  <span aria-hidden="true">·</span>
                  <span>${mins} ${escapeHtml(t.minRead)}</span>
                </div>
                <h2 class="note-title">${escapeHtml(post.title)}</h2>
                <p class="note-excerpt">${escapeHtml(post.excerpt)}</p>
              </li>
            `;
          }).join("")}
        </ul>
      `;
    }

    function bindNoteItemEvents() {
      appEl.querySelectorAll("[data-open-note]").forEach(el => {
        const open = () => {
          state.activeNoteId = el.dataset.openNote;
          state.view = "note";
          window.location.hash = `note/${encodeURIComponent(state.activeNoteId)}`;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        el.addEventListener("click", open);
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            open();
          }
        });
      });
    }

    function renderNotesList() {
      const t = UI[state.lang];
      const list = POSTS[state.lang];
      const categories = [...new Set(list.map(p => p.category))];
      if (state.selectedCategory && !categories.includes(state.selectedCategory)) {
        state.selectedCategory = null;
      }

      const filtered = getFilteredNotes();

      appEl.innerHTML = `
        <section class="controls">
          <input
            type="search"
            id="notesSearchInput"
            class="search-box"
            placeholder="${escapeHtml(t.searchNotesPlaceholder)}"
            value="${escapeHtml(state.notesSearch)}"
            aria-label="${escapeHtml(t.searchNotesPlaceholder)}"
          />
          <div class="tags-row">
            <div class="tags-bar" id="notesTagsBar">
              <button type="button" class="tag-chip ${!state.selectedCategory ? "active" : ""}" data-cat="">${escapeHtml(t.allFilter)}</button>
              ${categories.map(cat => `
                <button type="button" class="tag-chip ${state.selectedCategory === cat ? "active" : ""}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>
              `).join("")}
            </div>
          </div>
        </section>
        <div id="notesListContainer">
          ${buildNotesListMarkup(filtered, t)}
        </div>
      `;

      const searchInput = document.getElementById("notesSearchInput");
      searchInput.addEventListener("input", e => {
        state.notesSearch = e.target.value;
        document.getElementById("notesListContainer").innerHTML = buildNotesListMarkup(getFilteredNotes(), t);
        bindNoteItemEvents();
      });

      appEl.querySelectorAll("#notesTagsBar .tag-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedCategory = btn.dataset.cat || null;
          renderNotesList();
        });
      });

      bindNoteItemEvents();
    }

    /* --- TAB 1B: SINGLE NOTE READER --- */
    function renderSingleNote() {
      const t = UI[state.lang];
      const post = POSTS[state.lang].find(p => p.id === state.activeNoteId);
      if (!post) {
        state.view = "notes";
        state.activeNoteId = null;
        render();
        return;
      }

      const mins = estimateReadingMinutes(post.body);
      const mdExport = `# ${post.title}\n\n*${post.date} · ${post.category}*\n\n${post.body}\n`;
      const shareUrl = `${window.location.origin}${window.location.pathname}#note/${encodeURIComponent(post.id)}`;

      appEl.innerHTML = `
        <button type="button" class="back-btn" id="backNotesBtn">${escapeHtml(t.backToNotes)}</button>
        <article class="reader">
          <div class="note-meta">
            <time datetime="${escapeHtml(post.date)}">${escapeHtml(formatDate(post.date, state.lang))}</time>
            <span aria-hidden="true">·</span>
            <span class="note-category">${escapeHtml(post.category)}</span>
            <span aria-hidden="true">·</span>
            <span>${mins} ${escapeHtml(t.minRead)}</span>
          </div>
          <h1>${escapeHtml(post.title)}</h1>
          <div class="article-body">${renderMarkdown(post.body)}</div>
          <div class="article-actions">
            <button type="button" class="btn" id="copyNoteMdBtn">${escapeHtml(t.copyMd)}</button>
            <button type="button" class="btn" id="copyNoteLinkBtn">${escapeHtml(t.copyLink)}</button>
            <button type="button" class="btn" id="downloadNoteBtn">${escapeHtml(t.downloadMd)}</button>
          </div>
        </article>
      `;

      document.getElementById("backNotesBtn").addEventListener("click", () => {
        state.view = "notes";
        state.activeNoteId = null;
        window.location.hash = "notes";
        render();
      });

      document.getElementById("copyNoteMdBtn").addEventListener("click", () => {
        copyText(mdExport, t.toastMdCopied);
      });

      document.getElementById("copyNoteLinkBtn").addEventListener("click", () => {
        copyText(shareUrl, t.toastLinkCopied);
      });

      document.getElementById("downloadNoteBtn").addEventListener("click", () => {
        downloadFile(`${post.id}-${state.lang}.md`, mdExport, t.toastDownloaded);
      });
    }

    /* --- TAB 2A: BOOKS MAIN VIEW (OPEN CHAPTER CARD + FRAGMENTS) --- */
    function getFilteredFragments() {
      const q = state.booksSearch.trim().toLowerCase();
      const labels = THEME_LABELS[state.lang];
      return BOOK_THOUGHTS.filter(item => {
        const text = item[state.lang] || item.en;
        const themeLabel = labels[item.theme] || item.theme;
        const matchesTheme = !state.selectedBookTheme || item.theme === state.selectedBookTheme;
        const matchesQuery = !q ||
          text.toLowerCase().includes(q) ||
          themeLabel.toLowerCase().includes(q) ||
          item.id.toLowerCase().includes(q);
        return matchesTheme && matchesQuery;
      });
    }

    function formatFragmentCount(count, t) {
      const word = count === 1 ? t.fragmentSingular : t.fragmentPlural;
      return `${count} ${word}`;
    }

    function buildFragmentsMarkup(items, t) {
      if (!items.length) {
        return `<p class="empty-state">${escapeHtml(t.emptyBooks)}</p>`;
      }
      const labels = THEME_LABELS[state.lang];
      return `
        <div class="fragments-list">
          ${items.map(item => {
            const text = item[state.lang] || item.en;
            const themeLabel = labels[item.theme] || item.theme;
            return `
              <article class="fragment-card">
                <div class="fragment-top">
                  <div class="fragment-meta">
                    <span class="fragment-num">#${escapeHtml(item.id)}</span>
                    <span aria-hidden="true">·</span>
                    <span class="fragment-theme">${escapeHtml(themeLabel)}</span>
                  </div>
                  <button type="button" class="copy-frag-btn" data-copy-frag="${escapeHtml(item.id)}">${escapeHtml(t.copyFrag)}</button>
                </div>
                <p class="fragment-text">${formatInline(text)}</p>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function bindFragmentCopyEvents(t) {
      const labels = THEME_LABELS[state.lang];
      appEl.querySelectorAll("[data-copy-frag]").forEach(btn => {
        btn.addEventListener("click", () => {
          const frag = BOOK_THOUGHTS.find(f => f.id === btn.dataset.copyFrag);
          if (!frag) return;
          const text = frag[state.lang] || frag.en;
          const themeLabel = labels[frag.theme] || frag.theme;
          const payload = `"${text}"\n— catphilosophie (#${frag.id} · ${themeLabel})`;
          copyText(payload, t.toastFragCopied);
        });
      });
    }

    function renderBooks() {
      const t = UI[state.lang];
      const labels = THEME_LABELS[state.lang];
      const themeKeys = Object.keys(labels);
      const filtered = getFilteredFragments();
      const chapters = BOOK_CHAPTERS[state.lang] || [];

      const chaptersMarkup = chapters.map(ch => {
        const mins = estimateChapterMinutes(ch);
        return `
          <div class="chapters-showcase">
            <div class="section-kicker">${escapeHtml(ch.bookBadge)}</div>
            <article class="chapter-card" data-open-chapter="${escapeHtml(ch.id)}" tabindex="0" role="button">
              <div class="note-meta">
                <span class="note-category">${escapeHtml(ch.bookTitle)}</span>
                <span aria-hidden="true">·</span>
                <span>${escapeHtml(ch.chapterLabel)}</span>
                <span aria-hidden="true">·</span>
                <span>${mins} ${escapeHtml(t.minRead)}</span>
              </div>
              <h2 class="chapter-card-title">${escapeHtml(ch.title)}</h2>
              <p class="chapter-card-excerpt">${escapeHtml(ch.cardExcerpt)}</p>
              <ul class="chapter-card-toc">
                ${ch.sections.map(sec => `
                  <li>
                    <span class="toc-roman">${escapeHtml(sec.num)}.</span>
                    <span>${escapeHtml(sec.title)}</span>
                  </li>
                `).join("")}
              </ul>
              <span class="chapter-card-cta">${escapeHtml(ch.readCta)}</span>
            </article>
          </div>
        `;
      }).join("");

      appEl.innerHTML = `
        ${chaptersMarkup}

        <section class="books-intro">
          <h1 class="books-heading">${escapeHtml(t.booksHeading)}</h1>
          <p class="books-desc">${escapeHtml(t.booksDesc)}</p>
        </section>

        <section class="controls">
          <input
            type="search"
            id="booksSearchInput"
            class="search-box"
            placeholder="${escapeHtml(t.searchBooksPlaceholder)}"
            value="${escapeHtml(state.booksSearch)}"
            aria-label="${escapeHtml(t.searchBooksPlaceholder)}"
          />
          <div class="tags-row">
            <div class="tags-bar" id="booksTagsBar">
              <button type="button" class="tag-chip ${!state.selectedBookTheme ? "active" : ""}" data-theme-key="">${escapeHtml(t.allFilter)}</button>
              ${themeKeys.map(key => `
                <button type="button" class="tag-chip ${state.selectedBookTheme === key ? "active" : ""}" data-theme-key="${escapeHtml(key)}">${escapeHtml(labels[key])}</button>
              `).join("")}
            </div>
            <span class="count-label" id="fragmentsCount">${escapeHtml(formatFragmentCount(filtered.length, t))}</span>
          </div>
        </section>

        <div id="fragmentsContainer">
          ${buildFragmentsMarkup(filtered, t)}
        </div>
      `;

      appEl.querySelectorAll("[data-open-chapter]").forEach(card => {
        const openCh = () => {
          state.activeChapterId = card.dataset.openChapter;
          state.view = "chapter";
          window.location.hash = `book/${encodeURIComponent(state.activeChapterId)}`;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        card.addEventListener("click", openCh);
        card.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openCh();
          }
        });
      });

      const searchInput = document.getElementById("booksSearchInput");
      searchInput.addEventListener("input", e => {
        state.booksSearch = e.target.value;
        const nextItems = getFilteredFragments();
        document.getElementById("fragmentsCount").textContent = formatFragmentCount(nextItems.length, t);
        document.getElementById("fragmentsContainer").innerHTML = buildFragmentsMarkup(nextItems, t);
        bindFragmentCopyEvents(t);
      });

      appEl.querySelectorAll("#booksTagsBar .tag-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedBookTheme = btn.dataset.themeKey || null;
          renderBooks();
        });
      });

      bindFragmentCopyEvents(t);
    }

    /* --- TAB 2B: SINGLE CHAPTER READER --- */
    function renderSingleChapter() {
      const t = UI[state.lang];
      const chapter = (BOOK_CHAPTERS[state.lang] || []).find(c => c.id === state.activeChapterId);
      if (!chapter) {
        state.view = "books";
        state.activeChapterId = null;
        render();
        return;
      }

      const mins = estimateChapterMinutes(chapter);
      const mdExport = buildChapterMarkdown(chapter);
      const shareUrl = `${window.location.origin}${window.location.pathname}#book/${encodeURIComponent(chapter.id)}`;

      appEl.innerHTML = `
        <button type="button" class="back-btn" id="backBooksBtn">${escapeHtml(t.backToBooks)}</button>
        <article class="reader">
          <div class="note-meta">
            <span class="note-category">${escapeHtml(chapter.bookTitle)}</span>
            <span aria-hidden="true">·</span>
            <span>${escapeHtml(chapter.chapterLabel)}</span>
            <span aria-hidden="true">·</span>
            <span>${mins} ${escapeHtml(t.minRead)}</span>
          </div>
          <h1>${escapeHtml(chapter.title)}</h1>
          <div class="chapter-epigraph">
            <p class="chapter-epigraph-quote">${formatInline(chapter.epigraphQuote)}</p>
            <p class="chapter-epigraph-author">— ${formatInline(chapter.epigraphAuthor)}</p>
          </div>
          <nav class="chapter-jump-bar" aria-label="${escapeHtml(t.sectionsJumpLabel)}">
            <span class="jump-label">${escapeHtml(t.sectionsJumpLabel)}</span>
            ${chapter.sections.map(sec => `
              <button
                type="button"
                class="sec-jump-btn"
                data-jump-sec="chapter-sec-${escapeHtml(sec.num)}"
                title="${escapeHtml(sec.num + '. ' + sec.title)}"
              >${escapeHtml(sec.num)}</button>
            `).join("")}
          </nav>
          <div class="article-body">
            ${chapter.sections.map(sec => `
              <section class="chapter-sec" id="chapter-sec-${escapeHtml(sec.num)}">
                <h2><span class="chapter-sec-num">${escapeHtml(sec.num)}.</span>${escapeHtml(sec.title)}</h2>
                ${sec.paragraphs.map(p => `<p>${formatInline(p)}</p>`).join("")}
              </section>
            `).join("")}
          </div>
          <div class="article-actions">
            <button type="button" class="btn" id="copyChapMdBtn">${escapeHtml(t.copyMd)}</button>
            <button type="button" class="btn" id="copyChapLinkBtn">${escapeHtml(t.copyLink)}</button>
            <button type="button" class="btn" id="downloadChapBtn">${escapeHtml(t.downloadMd)}</button>
            <button type="button" class="btn" id="scrollTopChapBtn">${escapeHtml(t.backToTop)}</button>
          </div>
        </article>
      `;

      document.getElementById("backBooksBtn").addEventListener("click", () => {
        state.view = "books";
        state.activeChapterId = null;
        window.location.hash = "books";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      appEl.querySelectorAll("[data-jump-sec]").forEach(btn => {
        btn.addEventListener("click", () => {
          const target = document.getElementById(btn.dataset.jumpSec);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
      });

      document.getElementById("copyChapMdBtn").addEventListener("click", () => {
        copyText(mdExport, t.toastMdCopied);
      });

      document.getElementById("copyChapLinkBtn").addEventListener("click", () => {
        copyText(shareUrl, t.toastLinkCopied);
      });

      document.getElementById("downloadChapBtn").addEventListener("click", () => {
        downloadFile(`${chapter.id}-${state.lang}.md`, mdExport, t.toastDownloaded);
      });

      document.getElementById("scrollTopChapBtn").addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    /* --- TAB 3: ABOUT --- */
    function renderAbout() {
      const t = UI[state.lang];

      appEl.innerHTML = `
        <article class="about-view">
          <h1>${escapeHtml(t.aboutTitle)}</h1>
          <p>${t.aboutP1}</p>
          <p>${t.aboutP2}</p>
          <blockquote class="about-quote">${escapeHtml(t.aboutQuote)}</blockquote>
          <p>
            ${escapeHtml(t.aboutP3Before)}<button type="button" class="inline-link-btn" id="aboutGoNotes">${escapeHtml(t.navNotes)}</button>${escapeHtml(t.aboutP3Mid)}<button type="button" class="inline-link-btn" id="aboutGoBooks">${escapeHtml(t.navBooks)}</button>${escapeHtml(t.aboutP3After)}
          </p>
          <div class="license-box">
            <strong>${escapeHtml(t.licenseTitle)}</strong>
            ${escapeHtml(t.licenseText)}
          </div>
        </article>
      `;

      document.getElementById("aboutGoNotes").addEventListener("click", () => {
        state.view = "notes";
        state.activeNoteId = null;
        state.activeChapterId = null;
        window.location.hash = "notes";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.getElementById("aboutGoBooks").addEventListener("click", () => {
        state.view = "books";
        state.activeNoteId = null;
        state.activeChapterId = null;
        window.location.hash = "books";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    /* =========================================================================
       8. GLOBAL EVENT BINDINGS & STARTUP
       ========================================================================= */
    document.getElementById("brandLink").addEventListener("click", e => {
      e.preventDefault();
      state.view = "notes";
      state.activeNoteId = null;
      state.activeChapterId = null;
      state.selectedCategory = null;
      state.notesSearch = "";
      window.location.hash = "notes";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.querySelectorAll(".nav-link").forEach(btn => {
      btn.addEventListener("click", () => {
        state.view = btn.dataset.view;
        state.activeNoteId = null;
        state.activeChapterId = null;
        window.location.hash = state.view;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const nextLang = btn.dataset.lang;
        if (!VALID_LANGS.includes(nextLang) || state.lang === nextLang) return;
        state.lang = nextLang;
        try {
          localStorage.setItem("catphilosophie_lang_v2", state.lang);
        } catch (e) {}
        state.selectedCategory = null;
        render();
      });
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
    });

    window.addEventListener("hashchange", () => {
      syncFromHash();
      render();
    });

    syncFromHash();
    render();
  </script>
</body>
</html>
