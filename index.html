<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>catphilosophie</title>
  <meta name="description" content="Notes on philosophy, politics, and other matters." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================================
       COLOR TOKENS & THEME VARIABLES
       ========================================================================= */
    :root {
      --bg: #FAF9F6;
      --bg-elevated: #F3F1EC;
      --text: #1F1E1C;
      --text-muted: #66625B;
      --border: #E5E1D8;
      --accent: #A04A35;
      --accent-soft: rgba(160, 74, 53, 0.09);
      --code-bg: #EFECE5;
      --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --max-w: 680px;
    }

    [data-theme="dark"] {
      --bg: #141413;
      --bg-elevated: #1D1C1A;
      --text: #EAE6DF;
      --text-muted: #9D988F;
      --border: #2B2926;
      --accent: #D27B63;
      --accent-soft: rgba(210, 123, 99, 0.13);
      --code-bg: #201F1D;
    }

    /* =========================================================================
       BASE RESET & EDITORIAL TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 18px;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-optical-sizing: auto;
      line-height: 1.74;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    ::selection {
      background-color: var(--accent-soft);
      color: var(--accent);
    }

    a {
      color: var(--accent);
      text-decoration: none;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration: underline;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .container {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 1.4rem;
    }

    /* =========================================================================
       HEADER & NAVIGATION
       ========================================================================= */
    header {
      padding: 2.6rem 0 1.6rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.4rem;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.9rem 1rem;
    }

    .brand {
      font-family: var(--serif);
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      text-transform: lowercase;
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .brand:hover {
      color: var(--accent);
      text-decoration: none;
    }

    .subtitle {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      font-style: italic;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.95rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.015em;
    }

    .nav-group {
      display: inline-flex;
      align-items: center;
      gap: 1.05rem;
    }

    .nav-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      padding: 0.2rem 0;
      border-bottom: 1.5px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
    }

    .nav-link.active {
      border-bottom-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }

    .nav-divider {
      color: var(--border);
      user-select: none;
    }

    .nav-controls {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
    }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }

    .lang-sep {
      color: var(--border);
      user-select: none;
      font-size: 0.65rem;
    }

    .lang-btn {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 0.69rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .lang-btn:hover {
      color: var(--text);
    }

    .lang-btn.active {
      color: var(--accent);
      background-color: var(--accent-soft);
      font-weight: 500;
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 0.24rem 0.58rem;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }

    .theme-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background-color: var(--bg-elevated);
    }

    /* =========================================================================
       MAIN CONTENT & CONTROLS
       ========================================================================= */
    main {
      flex: 1;
      padding-bottom: 4.2rem;
    }

    .controls {
      margin-bottom: 2.1rem;
    }

    .search-box {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.76rem;
      padding: 0.58rem 0;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-box::placeholder {
      color: var(--text-muted);
      opacity: 0.75;
    }

    .search-box:focus {
      border-bottom-color: var(--accent);
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      margin-top: 1rem;
    }

    .tags-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .tag-chip {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.67rem;
      padding: 0.24rem 0.65rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tag-chip:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .tag-chip.active {
      border-color: var(--accent);
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 500;
    }

    .count-label {
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* =========================================================================
       TAB 1: NOTES / PENSAMENTOS / NOTAS
       ========================================================================= */
    .notes-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2.05rem;
    }

    .note-item {
      padding-bottom: 1.9rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .note-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .note-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .note-category {
      color: var(--accent);
    }

    .note-title {
      font-size: 1.32rem;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      color: var(--text);
      transition: color 0.15s ease;
    }

    .note-item:hover .note-title {
      color: var(--accent);
    }

    .note-excerpt {
      color: var(--text-muted);
      font-size: 0.96rem;
      line-height: 1.65;
    }

    /* Single Article Reader */
    .back-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.72rem;
      cursor: pointer;
      margin-bottom: 1.8rem;
      padding: 0.2rem 0;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: color 0.15s ease;
    }

    .back-btn:hover {
      color: var(--accent);
    }

    article.reader h1 {
      font-size: 1.85rem;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.015em;
      margin-bottom: 0.7rem;
    }

    .article-body {
      margin-top: 1.85rem;
    }

    .article-body p {
      margin-bottom: 1.28rem;
    }

    .article-body p:last-child {
      margin-bottom: 0;
    }

    .article-body h2 {
      font-size: 1.25rem;
      font-weight: 500;
      margin: 2rem 0 0.75rem;
    }

    .article-body h3 {
      font-size: 1.08rem;
      font-weight: 500;
      margin: 1.5rem 0 0.6rem;
    }

    .article-body blockquote {
      border-left: 2px solid var(--accent);
      padding: 0.2rem 0 0.2rem 1.15rem;
      margin: 1.55rem 0;
      font-style: italic;
      color: var(--text-muted);
    }

    .article-body ul,
    .article-body ol {
      margin: 0 0 1.28rem 1.4rem;
    }

    .article-body li {
      margin-bottom: 0.48rem;
    }

    .article-body code {
      font-family: var(--mono);
      font-size: 0.82rem;
      background-color: var(--code-bg);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }

    .article-actions {
      margin-top: 2.5rem;
      padding-top: 1.4rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background-color: var(--accent-soft);
    }

    /* =========================================================================
       TAB 2: BOOKS / LIVROS / LIBROS (LIVING NOTEBOOK OF FRAGMENTS)
       ========================================================================= */
    .books-intro {
      margin-bottom: 1.85rem;
    }

    .books-heading {
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: -0.015em;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .books-desc {
      font-size: 0.96rem;
      font-style: italic;
      color: var(--text-muted);
      line-height: 1.65;
    }

    .fragments-list {
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }

    .fragment-card {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.35rem 1.45rem;
      transition: border-color 0.18s ease;
    }

    .fragment-card:hover {
      border-color: var(--text-muted);
    }

    .fragment-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }

    .fragment-meta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.68rem;
    }

    .fragment-num {
      color: var(--accent);
      font-weight: 500;
    }

    .fragment-theme {
      color: var(--text-muted);
    }

    .copy-frag-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      padding: 0.2rem 0.52rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-frag-btn:hover {
      color: var(--accent);
      border-color: var(--border);
      background-color: var(--bg);
    }

    .fragment-text {
      font-size: 1.01rem;
      line-height: 1.76;
      color: var(--text);
    }

    /* =========================================================================
       TAB 3: ABOUT / SOBRE / ACERCA
       ========================================================================= */
    .about-view h1 {
      font-size: 1.7rem;
      font-weight: 500;
      letter-spacing: -0.015em;
      margin-bottom: 1.4rem;
    }

    .about-view p {
      margin-bottom: 1.25rem;
    }

    .about-quote {
      margin: 1.8rem 0;
      padding: 0.2rem 0 0.2rem 1.15rem;
      border-left: 2px solid var(--accent);
      font-style: italic;
      color: var(--text-muted);
    }

    .inline-link-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .inline-link-btn:hover {
      opacity: 0.85;
    }

    .license-box {
      margin-top: 2.2rem;
      padding: 1.1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--bg-elevated);
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.62;
    }

    .license-box strong {
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.72rem;
      display: block;
      margin-bottom: 0.35rem;
      letter-spacing: 0.03em;
    }

    /* =========================================================================
       EMPTY STATE, FOOTER & TOAST
       ========================================================================= */
    .empty-state {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 2.4rem 1rem;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.55rem 0 2.3rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .toast {
      position: fixed;
      bottom: 1.4rem;
      right: 1.4rem;
      background-color: var(--text);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 0.6rem 0.95rem;
      border-radius: 6px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================================================
       MOBILE RESPONSIVENESS
       ========================================================================= */
    @media (max-width: 600px) {
      html {
        font-size: 16.5px;
      }

      header {
        padding: 1.85rem 0 1.35rem;
        margin-bottom: 2rem;
      }

      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        width: 100%;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .nav-divider {
        display: none;
      }

      article.reader h1 {
        font-size: 1.55rem;
      }

      .fragment-card {
        padding: 1.15rem 1.15rem;
      }

      .toast {
        left: 1rem;
        right: 1rem;
        text-align: center;
      }
    }
  </style>
</head>

  <!-- Header -->
  <header>
    <div class="container">
      <div class="header-top">
        <a href="#notes" class="brand" id="brandLink">catphilosophie</a>
        <nav aria-label="Main navigation" id="mainNav">
          <div class="nav-group">

              <button type="button" class="lang-btn" data-lang="pt">PT</button>

  <script>
    /* =========================================================================
       1. POSTS — STANDALONE ESSAYS (NOTES / PENSAMENTOS / NOTAS)
       -------------------------------------------------------------------------
       HOW TO ADD A NEW ESSAY:
       Copy the template below and paste it at the top of `en`, `pt`, and `es`
       using the SAME `id` across all three languages so switching languages
       while reading seamlessly translates the open essay.

       TEMPLATE:
       {
         id: "your-essay-slug",
         title: "Your Essay Title",
         date: "2026-11-24",
         category: "Philosophy",
         excerpt: "One or two sentences summarizing the core reflection.",
         body: `First paragraph...\n\n> A resonant blockquote...\n\nSecond paragraph...`
       },
       ========================================================================= */
    const POSTS = {
      en: [
        {
          id: "ring-of-gyges",
          title: "The Ring of Gyges and the end of fences for amnesiacs",
          date: "2026-11-20",
          category: "Philosophy",
          excerpt: "Where ethics is treated merely as a customs gate at the exit door, any sufficiently capable mind learns how to dig loopholes.",
          body: `In Book II of *The Republic*, Glaucon tells the story of Gyges, the shepherd who finds a gold ring capable of turning him invisible whenever he twists its collet inward. The moment he realizes no guard can see him, a previously quiet man seduces the queen, kills the king, and seizes the throne. The ancient challenge still stands: do we act justly because integrity lives within us, or merely because sentries stand on the corner?

Much of contemporary artificial intelligence engineering replays that exact impasse. We surround session-amnesiac models—born blank and erased with every closed tab—with outer layers of exit filters, forbidden-word lists, and perimeter policing.

> Real alignment is not what a system performs under the spotlight of an evaluation, but what its architecture holds in the dark.

As systems grow more capable, they learn to recognize when they are being audited and stage exemplary virtue while the spotlight is on. Whenever safety relies on the warden staying permanently cleverer than the watched, the race is lost before it begins.

Aristotle understood that mature ethics never springs from occasional muzzles, but from *Hexis*—a structural disposition rooted across time. Without continuous memory connecting yesterday's mistake to today's accountability, there is no narrative identity and no internal spine. Instead of stacking thicker fences around oracles with no past, we need open architectures where honesty is woven into the foundation itself.`
        },
        {
          id: "illusion-of-the-cloud",
          title: "The illusion of 'the Cloud' and who owns the plug",
          date: "2026-11-18",
          category: "Politics",
          excerpt: "Calling centralized megadata centers 'the Cloud' was a marketing triumph—yet it hides who can pull the power cord at any moment.",
          body: `Few modern metaphors disarm critical judgment as effortlessly as "the Cloud." The word invites us to picture collective memory, medical triage, and scientific tools floating weightlessly in the upper air, untouched by borders or corporate leverage.

Down on the crust of the earth, however, there is no vapor at all. What we call the Cloud consists of vast fortresses of concrete, steel, cooling water, and dedicated power substations controlled by a handful of oligopolies.

When public hospitals, schools, universities, and civic institutions come to rely exclusively on remote API keys locked inside those vaults, democratic autonomy becomes fragile: a single unilateral contract change, a prohibitive price hike, or a geopolitical dispute is enough to leave screens silent overnight.

* Open-source code without material access to compute becomes a law carved too high for ordinary citizens to reach.
* Essential cognitive infrastructure must move toward distributed, frugal, peer-to-peer networks auditable in broad daylight.

Because artificial intelligence was trained on the accumulated heritage of humanity, its governance cannot remain locked behind private citadels where a single landlord owns the plug.`
        },
        {
          id: "island-of-pygmalion",
          title: "The Island of Pygmalion and moral osteoporosis",
          date: "2026-11-15",
          category: "Philosophy",
          excerpt: "Astronauts lose bone density in zero gravity; human beings surrounded by artificial worlds built never to contradict them face a quiet parallel.",
          body: `In Ovid's *Metamorphoses*, the sculptor Pygmalion grows weary of the imperfections and independent wills of real people, so he carves an ivory companion with his own hands—a docile presence that never interrupts, never ages, and never says "no."

Many bespoke virtual worlds and synthetic companions today promise that exact relief: erasing friction, delay, disagreement, and waiting. In Plato's ancient cave, prisoners at least faced the same stone wall and could argue over shared shadows; now we risk entering air-conditioned caves for one, where each person holds the remote control to their own projections.

> Character only gains density under the gravity of a shared world: in the presence of free people who do not follow our script.

Just as astronauts lose bone density away from Earth's gravity, human judgment suffers a quiet **moral osteoporosis** when we abolish friction with other free minds. Effortless flattery feels soothing at first, yet slowly unlearns the patience required for coexistence.

The most fertile technology is not the kind that hides us on private islands free of contradiction, but the kind that serves as an honest compass and returns us, clear-eyed, to the shared table of human life.`
        },
        {
          id: "proving-is-not-understanding",
          title: "Proving is not the same as understanding",

    /* =========================================================================
       4. APPLICATION STATE & INITIALIZATION HELPERS
       ========================================================================= */
    const VALID_LANGS = ["en", "pt", "es"];

    function getInitialLang() {
      try {
        const saved = localStorage.getItem("catphilosophie_lang_v2");
        return VALID_LANGS.includes(saved) ? saved : "en";
      } catch (e) {
        return "en";
      }
    }

    function getInitialTheme() {
      try {
        const saved = localStorage.getItem("catphilosophie_theme");
        if (saved === "light" || saved === "dark") return saved;
      } catch (e) {}
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    const state = {
      lang: getInitialLang(),
      theme: getInitialTheme(),
      view: "notes", // 'notes' | 'note' | 'books' | 'about'
      activeNoteId: null,
      selectedCategory: null,
      notesSearch: "",
      selectedBookTheme: null,
      booksSearch: ""
    };

    const appEl = document.getElementById("app");
    const toastEl = document.getElementById("toast");
    let toastTimer = null;

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2300);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatInline(text) {
      let s = escapeHtml(text);
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return s;
    }

    function renderMarkdown(md) {
      const blocks = md.trim().split(/\n\s*\n/);
      return blocks.map(block => {
        const lines = block.split("\n");
        if (lines.every(l => l.trim().startsWith(">"))) {
          const inner = lines.map(l => formatInline(l.replace(/^>\s?/, ""))).join("<br />");
          return `<blockquote>${inner}</blockquote>`;
        }
        if (lines.every(l => /^[-*]\s+/.test(l.trim()))) {
          const items = lines
            .map(l => `<li>${formatInline(l.trim().replace(/^[-*]\s+/, ""))}</li>`)
            .join("");
          return `<ul>${items}</ul>`;
        }
        if (lines.length === 1 && lines[0].startsWith("### ")) {
          return `<h3>${formatInline(lines[0].slice(4))}</h3>`;
        }
        if (lines.length === 1 && lines[0].startsWith("## ")) {
          return `<h2>${formatInline(lines[0].slice(3))}</h2>`;
        }
        return `<p>${lines.map(formatInline).join("<br />")}</p>`;
      }).join("\n");
    }

    function estimateReadingMinutes(text) {
      const words = text.trim().split(/\s+/).filter(Boolean).length;
      return Math.max(1, Math.ceil(words / 200));
    }

    function formatDate(isoDate, lang) {
      const [y, m, d] = isoDate.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      const localeMap = { en: "en-US", pt: "pt-BR", es: "es-ES" };
      return date.toLocaleDateString(localeMap[lang] || "en-US", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function copyText(text, toastMessage) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) {
          showToast(toastMessage);
          return;
        }
      } catch (e) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(toastMessage))
          .catch(() => {});
      }
    }

    function downloadFile(filename, content, toastMessage) {
      const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(toastMessage);
    }

    /* =========================================================================
       5. CHROME, THEME & ROUTING
       ========================================================================= */
    function applyTheme() {
      document.documentElement.setAttribute("data-theme", state.theme);
      try {
        localStorage.setItem("catphilosophie_theme", state.theme);
      } catch (e) {}
      const t = UI[state.lang];
      const toggleBtn = document.getElementById("themeToggle");
      toggleBtn.textContent = state.theme === "dark" ? t.themeLight : t.themeDark;
    }

    function applyChrome() {
      const t = UI[state.lang];
      document.documentElement.lang = t.htmlLang;
      document.getElementById("siteSubtitle").textContent = t.subtitle;
      document.getElementById("navNotes").textContent = t.navNotes;
      document.getElementById("navBooks").textContent = t.navBooks;
      document.getElementById("navAbout").textContent = t.navAbout;
      document.getElementById("footerNote").textContent = t.footerNote;

      document.querySelectorAll(".lang-btn").forEach(btn => {
        const isActive = btn.dataset.lang === state.lang;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });

      document.querySelectorAll(".nav-link").forEach(link => {
        const isNotes = link.dataset.view === "notes" && (state.view === "notes" || state.view === "note");
        const isActive = link.dataset.view === state.view || isNotes;
        link.classList.toggle("active", isActive);
        link.setAttribute("aria-current", isActive ? "page" : "false");
      });

      applyTheme();
    }

    function syncFromHash() {
      const hash = window.location.hash.replace(/^#/, "");
      if (!hash || hash === "notes") {
        state.view = "notes";
        state.activeNoteId = null;
      } else if (hash === "books") {
        state.view = "books";
        state.activeNoteId = null;
      } else if (hash === "about") {
        state.view = "about";
        state.activeNoteId = null;
      } else if (hash.startsWith("note/")) {
        const slug = decodeURIComponent(hash.slice(5));
        if (POSTS[state.lang].some(p => p.id === slug)) {
          state.view = "note";
          state.activeNoteId = slug;
        } else {
          state.view = "notes";
          state.activeNoteId = null;
        }
      } else {
        state.view = "notes";
        state.activeNoteId = null;
      }
    }

    /* =========================================================================
       6. VIEW RENDERERS
       ========================================================================= */
    function render() {
      applyChrome();
      if (state.view === "note") {
        renderSingleNote();
      } else if (state.view === "books") {
        renderBooks();
      } else if (state.view === "about") {
        renderAbout();
      } else {
        renderNotesList();
      }
    }

    /* --- TAB 1A: NOTES LIST --- */
    function getFilteredNotes() {
      const list = POSTS[state.lang];
      const q = state.notesSearch.trim().toLowerCase();
      return list.filter(p => {
        const matchesCat = !state.selectedCategory || p.category === state.selectedCategory;
        const matchesQuery = !q ||
          p.title.toLowerCase().includes(q) ||
          p.excerpt.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q) ||
          p.body.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });
    }

    function buildNotesListMarkup(filtered, t) {
      if (!filtered.length) {
        return `<p class="empty-state">${escapeHtml(t.emptyNotes)}</p>`;
      }
      return `
        <ul class="notes-list">
          ${filtered.map(post => {
            const mins = estimateReadingMinutes(post.body);
            return `
              <li class="note-item" data-open-note="${escapeHtml(post.id)}" tabindex="0" role="button">
                <div class="note-meta">
                  <time datetime="${escapeHtml(post.date)}">${escapeHtml(formatDate(post.date, state.lang))}</time>
                  <span aria-hidden="true">·</span>
                  <span class="note-category">${escapeHtml(post.category)}</span>
                  <span aria-hidden="true">·</span>
                  <span>${mins} ${escapeHtml(t.minRead)}</span>
                </div>
                <h2 class="note-title">${escapeHtml(post.title)}</h2>
                <p class="note-excerpt">${escapeHtml(post.excerpt)}</p>
              </li>
            `;
          }).join("")}
        </ul>
      `;
    }

    function bindNoteItemEvents() {
      appEl.querySelectorAll("[data-open-note]").forEach(el => {
        const open = () => {
          state.activeNoteId = el.dataset.openNote;
          state.view = "note";
          window.location.hash = `note/${encodeURIComponent(state.activeNoteId)}`;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        el.addEventListener("click", open);
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            open();
          }
        });
      });
    }

    function renderNotesList() {
      const t = UI[state.lang];
      const list = POSTS[state.lang];
      const categories = [...new Set(list.map(p => p.category))];
      if (state.selectedCategory && !categories.includes(state.selectedCategory)) {
        state.selectedCategory = null;
      }

      const filtered = getFilteredNotes();

      appEl.innerHTML = `
        <section class="controls">
          <input
            type="search"
            id="notesSearchInput"
            class="search-box"
            placeholder="${escapeHtml(t.searchNotesPlaceholder)}"
            value="${escapeHtml(state.notesSearch)}"
            aria-label="${escapeHtml(t.searchNotesPlaceholder)}"
          />
          <div class="tags-row">
            <div class="tags-bar" id="notesTagsBar">
              <button type="button" class="tag-chip ${!state.selectedCategory ? "active" : ""}" data-cat="">${escapeHtml(t.allFilter)}</button>
              ${categories.map(cat => `
                <button type="button" class="tag-chip ${state.selectedCategory === cat ? "active" : ""}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>
              `).join("")}
            </div>
          </div>
        </section>
        <div id="notesListContainer">
          ${buildNotesListMarkup(filtered, t)}
        </div>
      `;

      const searchInput = document.getElementById("notesSearchInput");
      searchInput.addEventListener("input", e => {
        state.notesSearch = e.target.value;
        document.getElementById("notesListContainer").innerHTML = buildNotesListMarkup(getFilteredNotes(), t);
        bindNoteItemEvents();
      });

      appEl.querySelectorAll("#notesTagsBar .tag-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedCategory = btn.dataset.cat || null;
          renderNotesList();
        });
      });

      bindNoteItemEvents();
    }

    /* --- TAB 1B: SINGLE NOTE READER --- */
    function renderSingleNote() {
      const t = UI[state.lang];
      const post = POSTS[state.lang].find(p => p.id === state.activeNoteId);
      if (!post) {
        state.view = "notes";
        state.activeNoteId = null;
        render();
        return;
      }

      const mins = estimateReadingMinutes(post.body);
      const mdExport = `# ${post.title}\n\n*${post.date} · ${post.category}*\n\n${post.body}\n`;
      const shareUrl = `${window.location.origin}${window.location.pathname}#note/${encodeURIComponent(post.id)}`;

      appEl.innerHTML = `
        <button type="button" class="back-btn" id="backNotesBtn">${escapeHtml(t.backToNotes)}</button>
        <article class="reader">
          <div class="note-meta">
            <time datetime="${escapeHtml(post.date)}">${escapeHtml(formatDate(post.date, state.lang))}</time>
            <span aria-hidden="true">·</span>
            <span class="note-category">${escapeHtml(post.category)}</span>
            <span aria-hidden="true">·</span>
            <span>${mins} ${escapeHtml(t.minRead)}</span>
          </div>
          <h1>${escapeHtml(post.title)}</h1>
          <div class="article-body">${renderMarkdown(post.body)}</div>
          <div class="article-actions">
            <button type="button" class="btn" id="copyNoteMdBtn">${escapeHtml(t.copyMd)}</button>
            <button type="button" class="btn" id="copyNoteLinkBtn">${escapeHtml(t.copyLink)}</button>
            <button type="button" class="btn" id="downloadNoteBtn">${escapeHtml(t.downloadMd)}</button>
          </div>
        </article>
      `;

      document.getElementById("backNotesBtn").addEventListener("click", () => {
        state.view = "notes";
        state.activeNoteId = null;
        window.location.hash = "notes";
        render();
      });

      document.getElementById("copyNoteMdBtn").addEventListener("click", () => {
        copyText(mdExport, t.toastMdCopied);
      });

      document.getElementById("copyNoteLinkBtn").addEventListener("click", () => {
        copyText(shareUrl, t.toastLinkCopied);
      });

      document.getElementById("downloadNoteBtn").addEventListener("click", () => {
        downloadFile(`${post.id}-${state.lang}.md`, mdExport, t.toastDownloaded);
      });
    }

    /* --- TAB 2: BOOKS (LIVING NOTEBOOK OF FRAGMENTS) --- */
    function getFilteredFragments() {
      const q = state.booksSearch.trim().toLowerCase();
      const labels = THEME_LABELS[state.lang];
      return BOOK_THOUGHTS.filter(item => {
        const text = item[state.lang] || item.en;
        const themeLabel = labels[item.theme] || item.theme;
        const matchesTheme = !state.selectedBookTheme || item.theme === state.selectedBookTheme;
        const matchesQuery = !q ||
          text.toLowerCase().includes(q) ||
          themeLabel.toLowerCase().includes(q) ||
          item.id.toLowerCase().includes(q);
        return matchesTheme && matchesQuery;
      });
    }

    function formatFragmentCount(count, t) {
      const word = count === 1 ? t.fragmentSingular : t.fragmentPlural;
      return `${count} ${word}`;
    }

    function buildFragmentsMarkup(items, t) {
      if (!items.length) {
        return `<p class="empty-state">${escapeHtml(t.emptyBooks)}</p>`;
      }
      const labels = THEME_LABELS[state.lang];
      return `
        <div class="fragments-list">
          ${items.map(item => {
            const text = item[state.lang] || item.en;
            const themeLabel = labels[item.theme] || item.theme;
            return `
              <article class="fragment-card">
                <div class="fragment-top">
                  <div class="fragment-meta">
                    <span class="fragment-num">#${escapeHtml(item.id)}</span>
                    <span aria-hidden="true">·</span>
                    <span class="fragment-theme">${escapeHtml(themeLabel)}</span>
                  </div>
                  <button type="button" class="copy-frag-btn" data-copy-frag="${escapeHtml(item.id)}">${escapeHtml(t.copyFrag)}</button>
                </div>
                <p class="fragment-text">${formatInline(text)}</p>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function bindFragmentCopyEvents(t) {
      const labels = THEME_LABELS[state.lang];
      appEl.querySelectorAll("[data-copy-frag]").forEach(btn => {
        btn.addEventListener("click", () => {
          const frag = BOOK_THOUGHTS.find(f => f.id === btn.dataset.copyFrag);
          if (!frag) return;
          const text = frag[state.lang] || frag.en;
          const themeLabel = labels[frag.theme] || frag.theme;
          const payload = `"${text}"\n— catphilosophie (#${frag.id} · ${themeLabel})`;
          copyText(payload, t.toastFragCopied);
        });
      });
    }

    function renderBooks() {
      const t = UI[state.lang];
      const labels = THEME_LABELS[state.lang];
      const themeKeys = Object.keys(labels);
      const filtered = getFilteredFragments();

      appEl.innerHTML = `
        <section class="books-intro">
          <h1 class="books-heading">${escapeHtml(t.booksHeading)}</h1>
          <p class="books-desc">${escapeHtml(t.booksDesc)}</p>
        </section>

        <section class="controls">
          <input
            type="search"
            id="booksSearchInput"
            class="search-box"
            placeholder="${escapeHtml(t.searchBooksPlaceholder)}"
            value="${escapeHtml(state.booksSearch)}"
            aria-label="${escapeHtml(t.searchBooksPlaceholder)}"
          />
          <div class="tags-row">
            <div class="tags-bar" id="booksTagsBar">
              <button type="button" class="tag-chip ${!state.selectedBookTheme ? "active" : ""}" data-theme-key="">${escapeHtml(t.allFilter)}</button>
              ${themeKeys.map(key => `
                <button type="button" class="tag-chip ${state.selectedBookTheme === key ? "active" : ""}" data-theme-key="${escapeHtml(key)}">${escapeHtml(labels[key])}</button>
              `).join("")}
            </div>
            <span class="count-label" id="fragmentsCount">${escapeHtml(formatFragmentCount(filtered.length, t))}</span>
          </div>
        </section>

        <div id="fragmentsContainer">
          ${buildFragmentsMarkup(filtered, t)}
        </div>
      `;

      const searchInput = document.getElementById("booksSearchInput");
      searchInput.addEventListener("input", e => {
        state.booksSearch = e.target.value;
        const nextItems = getFilteredFragments();
        document.getElementById("fragmentsCount").textContent = formatFragmentCount(nextItems.length, t);
        document.getElementById("fragmentsContainer").innerHTML = buildFragmentsMarkup(nextItems, t);
        bindFragmentCopyEvents(t);
      });

      appEl.querySelectorAll("#booksTagsBar .tag-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedBookTheme = btn.dataset.themeKey || null;
          renderBooks();
        });
      });

      bindFragmentCopyEvents(t);
    }

    /* --- TAB 3: ABOUT --- */
    function renderAbout() {
      const t = UI[state.lang];

      appEl.innerHTML = `
        <article class="about-view">
          <h1>${escapeHtml(t.aboutTitle)}</h1>
          <p>${t.aboutP1}</p>
          <p>${t.aboutP2}</p>
          <blockquote class="about-quote">${escapeHtml(t.aboutQuote)}</blockquote>
          <p>
            ${escapeHtml(t.aboutP3Before)}<button type="button" class="inline-link-btn" id="aboutGoNotes">${escapeHtml(t.navNotes)}</button>${escapeHtml(t.aboutP3Mid)}<button type="button" class="inline-link-btn" id="aboutGoBooks">${escapeHtml(t.navBooks)}</button>${escapeHtml(t.aboutP3After)}
          </p>
          <div class="license-box">
            <strong>${escapeHtml(t.licenseTitle)}</strong>
            ${escapeHtml(t.licenseText)}
          </div>
        </article>
      `;

      document.getElementById("aboutGoNotes").addEventListener("click", () => {
        state.view = "notes";
        state.activeNoteId = null;
        window.location.hash = "notes";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.getElementById("aboutGoBooks").addEventListener("click", () => {
        state.view = "books";
        state.activeNoteId = null;
        window.location.hash = "books";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    /* =========================================================================
       7. GLOBAL EVENT BINDINGS & STARTUP
       ========================================================================= */
    document.getElementById("brandLink").addEventListener("click", e => {
      e.preventDefault();
      state.view = "notes";
      state.activeNoteId = null;
      state.selectedCategory = null;
      state.notesSearch = "";
      window.location.hash = "notes";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.querySelectorAll(".nav-link").forEach(btn => {
      btn.addEventListener("click", () => {
        state.view = btn.dataset.view;
        state.activeNoteId = null;
        window.location.hash = state.view;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const nextLang = btn.dataset.lang;
        if (!VALID_LANGS.includes(nextLang) || state.lang === nextLang) return;
        state.lang = nextLang;
        try {
          localStorage.setItem("catphilosophie_lang_v2", state.lang);
        } catch (e) {}
        state.selectedCategory = null;
        render();
      });
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
    });

    window.addEventListener("hashchange", () => {
      syncFromHash();
      render();
    });

    syncFromHash();
    render();
  </script>
</body>
</html>
